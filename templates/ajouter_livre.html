<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter un livre</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, #74ebd5, #ACB6E5);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .form-container {
            background-color: white;
            padding: 40px 50px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            margin-bottom: 25px;
            color: #333;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            text-align: left;
            font-weight: bold;
            color: #555;
        }

        input[type="text"], input[type="number"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            width: 100%;
        }

        input[type="submit"] {
            padding: 12px;
            background-color: #4CAF50;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        input[type="submit"]:hover {
            background-color: #45a049;
        }

        .back-link {
            display: inline-block;
            margin-top: 15px;
            text-decoration: none;
            color: white;
            background-color: #27ae60;
            padding: 10px 20px;
            border-radius: 8px;
            transition: background-color 0.3s;
        }

        .back-link:hover {
            background-color: #2ecc71;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>Ajouter un livre</h1>
        <form method="post">
            <label for="titre">Titre :</label>
            <input type="text" id="titre" name="titre" placeholder="Titre du livre" required>

            <label for="auteur">Auteur :</label>
            <input type="text" id="auteur" name="auteur" placeholder="Nom de l'auteur" required>

            <label for="stock">Stock :</label>
            <input type="number" id="stock" name="stock" min="0" value="1" required>

            <input type="submit" value="Ajouter">
        </form>
        <a class="back-link" href="{{ url_for('lire_livres') }}">← Retour à la liste des livres</a>
    </div>
</body>
</html>
