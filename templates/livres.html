<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Livres</title>
    <style>
        body { font-family: Arial; background: #f5f5f5; margin:0; padding:0; }
        .container { max-width:800px; margin:30px auto; background:white; padding:20px; border-radius:8px; }
        table { width:100%; border-collapse: collapse; }
        th, td { padding:10px; border-bottom:1px solid #ddd; text-align:left; }
        th { background:#4CAF50; color:white; }
        form { display:inline; }
        button { background:#27ae60; color:white; border:none; padding:5px 10px; border-radius:5px; cursor:pointer; }
        button:hover { background:#2ecc71; }
        a { text-decoration:none; color:white; background:#4CAF50; padding:8px 15px; border-radius:5px; display:inline-block; margin-bottom:10px; }
    </style>
</head>
<body>
<div class="container">
    <h1>Liste des livres</h1>
    <a href="{{ url_for('ajouter_livre') }}">Ajouter un livre</a>
    <table>
        <tr>
            <th>Titre</th>
            <th>Auteur</th>
            <th>Stock</th>
            <th>Actions</th>
        </tr>
        {% for livre in livres %}
        <tr>
            <td>{{ livre[1] }}</td>
            <td>{{ livre[2] }}</td>
            <td>{{ livre[3] }}</td>
            <td>
                {% if livre[3] > 0 %}
                <form action="{{ url_for('emprunter_livre', livre_id=livre[0]) }}" method="post">
                    <button>Emprunter</button>
                </form>
                {% endif %}
                <form action="{{ url_for('retour_livre', livre_id=livre[0]) }}" method="post">
                    <button>Retour</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>
</div>
</body>
</html>
