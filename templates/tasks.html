<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Gestionnaire de tâches</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #4CAF50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        h1, h2 {
            margin: 0 0 15px 0;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            background-color: #f9f9f9;
            margin-bottom: 10px;
            padding: 15px;
            border-left: 5px solid #4CAF50;
            border-radius: 4px;
        }

        li span.status {
            font-weight: bold;
            float: right;
            color: #555;
        }

        a, button {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: white;
            background-color: #4CAF50;
            padding: 10px 20px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
        }

        a:hover, button:hover {
            background-color: #45a049;
        }

        .empty {
            color: #777;
            font-style: italic;
        }

        form input, form select {
            padding: 8px;
            margin-right: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        form button {
            margin-top: 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>Gestionnaire de tâches</h1>
    </header>

    <div class="container">
        <!-- Formulaire pour ajouter une tâche -->
        <h2>Créer une nouvelle tâche</h2>
        <form action="{{ url_for('ajouter_task') }}" method="POST">
            <input type="text" name="title" placeholder="Titre" required>
            <input type="text" name="description" placeholder="Description">
            <select name="status">
                <option value="pending">En attente</option>
                <option value="done">Terminée</option>
            </select>
            <button type="submit">Ajouter</button>
        </form>

        <!-- Liste des tâches -->
        <h2>Liste des tâches</h2>
        <ul>
        {% for task in tasks %}
            <li>
                {{ task.title }}
                <span class="status">{{ task.status }}</span><br>
                {{ task.description }}
            </li>
        {% else %}
            <li class="empty">Aucune tâche pour le moment.</li>
        {% endfor %}
        </ul>

        <a href="/">← Retour accueil</a>
    </div>
</body>
</html>
